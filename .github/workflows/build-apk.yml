name: CI and Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Si llega un push nuevo mientras corre uno anterior de la misma rama,
# se cancela el viejo y no se gastan minutos de runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CI: lint y tests en cada push y en cada pull request.
  # No necesita secrets, asi que tambien corre en PRs de forks.
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Build del APK: solo en push a main y solo si lint y tests pasaron.
  build:
    name: Build APK
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        # Sin estas variables Vite compila el bundle con `undefined` y la app
        # queda en pantalla blanca dentro del APK. No vienen de .env: esta
        # gitignoreado y nunca llega al runner.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nutrigym-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
